name: verificacao-didatica
on:
  pull_request:
    paths:
      - "sistema-gestao-escolar/**"
jobs:
  javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        projeto: [mysql2, sequelize]
    defaults:
      run:
        working-directory: sistema-gestao-escolar/src/backend/${{ matrix.projeto }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: find src -name "*.js" -print0 | xargs -0 -n1 node --check
