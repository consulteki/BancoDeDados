<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gestão Escolar — Alunos</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">Sistema de Gestão Escolar</p>
      <h1>Cadastro de alunos</h1>
      <p>CRUD didático em Vanilla JavaScript, sem backend.</p>
    </header>

    <section class="card">
      <h2 id="form-title">Novo aluno</h2>
      <form id="student-form">
        <input id="id" type="hidden">
        <label>Matrícula <input id="matricula" required maxlength="30"></label>
        <label>Nome <input id="nome" required minlength="2" maxlength="150"></label>
        <label>E-mail <input id="email" type="email" maxlength="254"></label>
        <label>Situação
          <select id="situacao"><option>ATIVO</option><option>INATIVO</option></select>
        </label>
        <div class="actions">
          <button type="submit">Salvar</button>
          <button id="cancel-edit" type="button" class="secondary" hidden>Cancelar edição</button>
        </div>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2>Alunos</h2>
        <input id="search" type="search" placeholder="Buscar por nome ou matrícula" aria-label="Buscar alunos">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Matrícula</th><th>Nome</th><th>E-mail</th><th>Situação</th><th>Ações</th></tr></thead>
          <tbody id="student-list"></tbody>
        </table>
      </div>
      <p id="empty">Nenhum aluno encontrado.</p>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
