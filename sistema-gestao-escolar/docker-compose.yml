services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gestao_escolar}
      MYSQL_USER: ${MYSQL_USER:-gestao_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/scripts/00-criar-banco.sql:/docker-entrypoint-initdb.d/00-criar-banco.sql:ro
      - ./docs/scripts/01-criar-tabelas.sql:/docker-entrypoint-initdb.d/01-criar-tabelas.sql:ro
      - ./docs/scripts/03-inserir-dados.sql:/docker-entrypoint-initdb.d/03-inserir-dados.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 15

  api:
    build: ./src/backend/sequelize
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-gestao_escolar}
      DB_USER: ${MYSQL_USER:-gestao_app}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
